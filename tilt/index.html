<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d10">
<title>Tilt Ball — Psychard</title>
<meta name="description" content="Tilt your phone to roll a ball across eight colours. Every colour is a note of the D major scale; pick the instrument that plays them.">
<link rel="canonical" href="https://www.psychard.com/tilt/">
<link rel="manifest" href="/tilt/manifest.json">
<link rel="icon" href="/icons/psychard.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/tilt.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tilt Ball">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.psychard.com/tilt/">
<meta property="og:title" content="Tilt Ball">
<meta property="og:description" content="Tilt your phone to roll a ball across eight notes of the D major scale.">
<meta property="og:image" content="https://www.psychard.com/icons/og.png">
<style>
  :root{
    --c1:#ff2f6d; --c2:#ff8a00; --c3:#ffd400; --c4:#3ddc84;
    --c5:#00b3a4; --c6:#2d7bff; --c7:#7b4dff; --c8:#ff5fd2;
    --ink:#111114;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;background:#0d0d10}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
    touch-action:none;overscroll-behavior:none;position:fixed;inset:0;
  }

  #field{position:absolute;inset:-14%;filter:blur(34px) saturate(1.12)}
  .blob{position:absolute;border-radius:52% 48% 43% 57% / 47% 55% 45% 53%}
  .b1{background:var(--c1);left:-8%;top:-6%;width:62%;height:34%}
  .b2{background:var(--c2);left:44%;top:-9%;width:64%;height:31%;border-radius:60% 40% 55% 45% / 55% 50% 50% 45%}
  .b3{background:var(--c3);left:-10%;top:21%;width:58%;height:30%;border-radius:45% 55% 60% 40% / 50% 45% 55% 50%}
  .b4{background:var(--c4);left:41%;top:19%;width:67%;height:29%}
  .b5{background:var(--c5);left:-9%;top:45%;width:60%;height:31%;border-radius:55% 45% 40% 60% / 45% 55% 45% 55%}
  .b6{background:var(--c6);left:43%;top:43%;width:65%;height:33%}
  .b7{background:var(--c7);left:-11%;top:69%;width:63%;height:39%;border-radius:50% 50% 45% 55% / 55% 45% 55% 45%}
  .b8{background:var(--c8);left:42%;top:71%;width:66%;height:37%}

  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  #gate{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;
    background:rgba(10,10,14,.42);backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
  }
  #gate .lead{
    margin:0;color:#fff;font-size:19px;line-height:1.5;
    text-align:center;max-width:16ch;text-shadow:0 1px 14px rgba(0,0,0,.45)
  }
  #gate .sub{
    margin:0;color:#fff;opacity:.72;font-size:14px;line-height:1.5;
    text-align:center;max-width:26ch;text-shadow:0 1px 12px rgba(0,0,0,.5)
  }
  #gate .home{
    position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));
    color:#fff;opacity:.55;font-size:13px;text-decoration:none;
    text-shadow:0 1px 10px rgba(0,0,0,.5)
  }
  button{font:inherit;border:0;cursor:pointer;color:var(--ink)}
  #go{
    font-size:16px;background:#fff;border-radius:999px;padding:15px 30px;
    box-shadow:0 8px 26px rgba(0,0,0,.3);
  }
  #go:active{transform:translateY(1px)}
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}

  #recenter{
    position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top));
    display:none;padding:9px 15px;font-size:13px;border-radius:999px;
    background:rgba(255,255,255,.8);box-shadow:0 4px 14px rgba(0,0,0,.2);
  }

  #rack{
    position:absolute;left:0;right:0;bottom:0;display:none;
    padding:14px 12px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(8,8,12,.55),rgba(8,8,12,0));
  }
  #rack .row{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
  .voice{
    padding:9px 15px;font-size:13.5px;border-radius:999px;
    background:rgba(255,255,255,.16);color:#fff;
    border:1px solid rgba(255,255,255,.32);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .voice[aria-pressed="true"]{
    background:#fff;color:var(--ink);border-color:#fff;
    box-shadow:0 4px 16px rgba(0,0,0,.28);
  }
  #enable{
    display:none;margin:0 auto 10px;padding:10px 18px;font-size:14px;
    border-radius:999px;background:#fff;color:var(--ink);
    box-shadow:0 4px 16px rgba(0,0,0,.28);
  }
  #hint{
    margin:0 0 10px;padding:0 2px;text-align:center;
    color:#fff;font-size:13px;line-height:1.45;opacity:.78;
    text-shadow:0 1px 10px rgba(0,0,0,.55);display:none;pointer-events:none
  }
  .hidden{display:none !important}
</style>
</head>
<body>

<div id="field">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="blob b3"></div><div class="blob b4"></div>
  <div class="blob b5"></div><div class="blob b6"></div>
  <div class="blob b7"></div><div class="blob b8"></div>
</div>

<canvas id="stage"></canvas>

<button id="recenter">Recenter</button>

<div id="rack">
  <button id="enable">Enable tilt</button>
  <p id="hint">No tilt sensor available here. Press and hold anywhere; the surface tips toward your finger and levels off when you let go.</p>
  <div class="row">
    <button class="voice" data-v="violin">Violin</button>
    <button class="voice" data-v="piano">Piano</button>
    <button class="voice" data-v="harp">Harp</button>
    <button class="voice" data-v="trumpet">Trumpet</button>
    <button class="voice" data-v="flute">Flute</button>
    <button class="voice" data-v="percussion">Percussion</button>
    <button class="voice" data-v="off">Mute</button>
  </div>
</div>

<div id="gate">
  <p class="lead">Hold the phone flat, then tilt to roll the ball.</p>
  <p class="sub">Every color is a note of the D major scale; pick the instrument at the bottom.</p>
  <button id="go">Start</button>
  <a class="home" href="/">psychard.com</a>
</div>

<script>
(function(){
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const gate = document.getElementById('gate');
  const goBtn = document.getElementById('go');
  const rack = document.getElementById('rack');
  const recenterBtn = document.getElementById('recenter');
  const enableBtn = document.getElementById('enable');
  const hint = document.getElementById('hint');

  let W = 0, H = 0, R = 24;
  const ball = { x:0, y:0, vx:0, vy:0 };

  const BASE = 293.6648;              // D4
  const NOTES = [
    {n:'D',  s:0},  {n:'E',  s:2},  {n:'F\u266F', s:4},  {n:'G', s:5},
    {n:'A',  s:7},  {n:'B',  s:9},  {n:'C\u266F', s:11}, {n:'D', s:12}
  ];
  const HUES = ['#ff2f6d','#ff8a00','#ffd400','#3ddc84','#00b3a4','#2d7bff','#7b4dff','#ff5fd2']
    .map(h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]);

  let centers = [];
  const wts = new Array(8).fill(0);
  let semi = 0, domIdx = 0, domW = 0;

  let M = [1,0,0, 0,1,0, 0,0,1];
  const dots = [];
  (function seedDots(){
    const n = 26, off = 2/n, inc = Math.PI * (3 - Math.sqrt(5));
    for (let i=0;i<n;i++){
      const y = i*off - 1 + off/2;
      const r = Math.sqrt(Math.max(0,1-y*y));
      const phi = i*inc;
      dots.push([Math.cos(phi)*r, y, Math.sin(phi)*r]);
    }
  })();

  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

  function measure(){
    centers = Array.prototype.map.call(document.querySelectorAll('.blob'), el => {
      const r = el.getBoundingClientRect();
      return { x: r.left + r.width/2, y: r.top + r.height/2 };
    });
  }
  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    R = Math.max(15, Math.min(W,H) * 0.058);
    ball.x = clamp(ball.x || W/2, R, W-R);
    ball.y = clamp(ball.y || H/2, R, H-R);
    measure();
  }
  window.addEventListener('resize', resize);
  resize();

  function mixNotes(){
    if (!centers.length) return;
    const eps = Math.min(W,H) * 0.012;
    let tot = 0;
    for (let i=0;i<8;i++){
      const dx = ball.x - centers[i].x, dy = ball.y - centers[i].y;
      const d = Math.sqrt(dx*dx + dy*dy) + eps;
      const w = 1/(d*d*d*d);
      wts[i] = w; tot += w;
    }
    let acc = 0; domW = 0; domIdx = 0;
    for (let i=0;i<8;i++){
      wts[i] /= tot;
      acc += wts[i] * NOTES[i].s;
      if (wts[i] > domW){ domW = wts[i]; domIdx = i; }
    }
    semi = acc;
  }
  function currentFreq(){ return BASE * Math.pow(2, semi/12); }
  function mixedColor(){
    let r=0,g=0,b=0;
    for (let i=0;i<8;i++){ r += HUES[i][0]*wts[i]; g += HUES[i][1]*wts[i]; b += HUES[i][2]*wts[i]; }
    return [r|0, g|0, b|0];
  }

  // ---- instruments ------------------------------------------------------
  const KIT = {
    violin: { kind:'bowed', partials:[{t:'sawtooth',g:0.5,m:1},{t:'sawtooth',g:0.4,m:1,det:8}],
              cutoff:1900, q:1.6, level:0.13, attack:0.18, vibRate:5.4, vibDepth:8, breath:0 },
    trumpet:{ kind:'bowed', partials:[{t:'sawtooth',g:0.5,m:1},{t:'square',g:0.2,m:2}],
              cutoff:2500, q:4.0, level:0.11, attack:0.07, vibRate:5.6, vibDepth:5, breath:0 },
    flute:  { kind:'bowed', partials:[{t:'sine',g:0.75,m:1},{t:'triangle',g:0.1,m:2}],
              cutoff:2700, q:0.8, level:0.16, attack:0.12, vibRate:4.9, vibDepth:4, breath:0.035 },
    piano:  { kind:'struck', partials:[{t:'triangle',g:0.6,m:1},{t:'sine',g:0.24,m:2},{t:'sine',g:0.1,m:3.01}],
              decay:1.9, attack:0.004, cutoff:3400, level:0.3, gap:110 },
    harp:   { kind:'struck', partials:[{t:'triangle',g:0.45,m:1},{t:'sine',g:0.3,m:2},{t:'sine',g:0.14,m:4}],
              decay:1.5, attack:0.003, cutoff:4200, level:0.26, gap:70 },
    percussion:{ kind:'struck', partials:[{t:'sine',g:0.7,m:1},{t:'sine',g:0.22,m:4},{t:'sine',g:0.08,m:9.2}],
              decay:0.42, attack:0.002, cutoff:5200, level:0.34, gap:90, click:true }
  };

  const VOICE_KEY = 'tilt-ball.voice';
  function savedVoice(){
    let v = null;
    try { v = localStorage.getItem(VOICE_KEY); } catch(_) {}
    // a remembered mute would look like a broken app on the next visit
    return (v && v !== 'off' && KIT[v]) ? v : 'violin';
  }

  let AC = null, master = null, noiseBuf = null;
  let voice = 'violin';
  let sus = null;                       // live bowed chain
  let lastStrike = 0, lastStrikeSemi = -99;

  function makeNoise(){
    const len = Math.floor(AC.sampleRate * 1.2);
    const b = AC.createBuffer(1, len, AC.sampleRate);
    const d = b.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = Math.random()*2 - 1;
    return b;
  }

  function initAudio(){
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return false;
    AC = new Ctor();
    master = AC.createGain();
    master.gain.value = 0.9;
    master.connect(AC.destination);
    noiseBuf = makeNoise();
    return true;
  }

  function stopSustain(){
    if (!sus) return;
    const t = AC.currentTime;
    sus.gain.gain.cancelScheduledValues(t);
    sus.gain.gain.setTargetAtTime(0.0001, t, 0.05);
    const nodes = sus.nodes;
    setTimeout(() => { nodes.forEach(n => { try{ n.stop(); }catch(_){} try{ n.disconnect(); }catch(_){} }); }, 400);
    sus = null;
  }

  function startSustain(cfg){
    const t = AC.currentTime;
    const out = AC.createGain(); out.gain.value = 0.0001;
    const lpf = AC.createBiquadFilter();
    lpf.type = 'lowpass'; lpf.frequency.value = cfg.cutoff; lpf.Q.value = cfg.q;
    lpf.connect(out); out.connect(master);

    const lfo = AC.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = cfg.vibRate;
    const lfoG = AC.createGain(); lfoG.gain.value = cfg.vibDepth;
    lfo.connect(lfoG); lfo.start();

    const oscs = [], nodes = [lfo];
    for (const p of cfg.partials){
      const o = AC.createOscillator(); o.type = p.t;
      o.frequency.value = currentFreq() * p.m;
      if (p.det) o.detune.value = p.det;
      lfoG.connect(o.detune);
      const g = AC.createGain(); g.gain.value = p.g;
      o.connect(g); g.connect(lpf); o.start();
      oscs.push({o, m:p.m}); nodes.push(o);
    }
    if (cfg.breath){
      const n = AC.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
      const hp = AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 1400;
      const ng = AC.createGain(); ng.gain.value = cfg.breath;
      n.connect(hp); hp.connect(ng); ng.connect(lpf); n.start();
      nodes.push(n);
    }
    out.gain.setTargetAtTime(cfg.level, t, cfg.attack);
    sus = { gain:out, lpf, oscs, nodes, cfg };
  }

  function strike(cfg, vel){
    const t = AC.currentTime;
    const f = currentFreq();
    const out = AC.createGain();
    const peak = cfg.level * clamp(vel, 0.35, 1.15);
    out.gain.setValueAtTime(0.0001, t);
    out.gain.exponentialRampToValueAtTime(peak, t + cfg.attack);
    out.gain.exponentialRampToValueAtTime(0.0001, t + cfg.decay);
    const lpf = AC.createBiquadFilter();
    lpf.type = 'lowpass';
    lpf.frequency.setValueAtTime(cfg.cutoff, t);
    lpf.frequency.exponentialRampToValueAtTime(Math.max(400, cfg.cutoff*0.25), t + cfg.decay);
    lpf.connect(out); out.connect(master);

    for (const p of cfg.partials){
      const o = AC.createOscillator(); o.type = p.t;
      o.frequency.value = f * p.m;
      const g = AC.createGain(); g.gain.value = p.g;
      o.connect(g); g.connect(lpf);
      o.start(t); o.stop(t + cfg.decay + 0.1);
    }
    if (cfg.click){
      const n = AC.createBufferSource(); n.buffer = noiseBuf;
      const bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = f*6; bp.Q.value = 1.4;
      const ng = AC.createGain();
      ng.gain.setValueAtTime(peak*0.5, t);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      n.connect(bp); bp.connect(ng); ng.connect(master);
      n.start(t); n.stop(t + 0.08);
    }
    setTimeout(() => { try{ out.disconnect(); lpf.disconnect(); }catch(_){} }, (cfg.decay+0.3)*1000);
  }

  function selectVoice(name){
    voice = name;
    if (name !== 'off'){ try { localStorage.setItem(VOICE_KEY, name); } catch(_) {} }
    Array.prototype.forEach.call(document.querySelectorAll('.voice'), b => {
      b.setAttribute('aria-pressed', String(b.dataset.v === name));
    });
    if (!AC) return;
    if (AC.state === 'suspended') AC.resume();
    stopSustain();
    if (name === 'off') return;
    const cfg = KIT[name];
    if (cfg.kind === 'bowed') startSustain(cfg);
    else { strike(cfg, 0.9); lastStrike = performance.now(); lastStrikeSemi = semi; }
  }

  Array.prototype.forEach.call(document.querySelectorAll('.voice'), b => {
    b.addEventListener('click', () => selectVoice(b.dataset.v));
  });

  function updateTone(){
    if (!AC || voice === 'off') return;
    const cfg = KIT[voice];
    const speed = Math.hypot(ball.vx, ball.vy);
    if (cfg.kind === 'bowed'){
      if (!sus) return;
      const t = AC.currentTime, f = currentFreq();
      for (const {o,m} of sus.oscs) o.frequency.setTargetAtTime(f*m, t, 0.035);
      sus.lpf.frequency.setTargetAtTime(cfg.cutoff + Math.min(1500, speed*1.6), t, 0.1);
      sus.gain.gain.setTargetAtTime(cfg.level * (0.82 + Math.min(0.28, speed/1400)), t, 0.12);
    } else {
      // struck voices re-sound each time the ball reaches a new pitch
      const now = performance.now();
      if (now - lastStrike > cfg.gap && Math.abs(semi - lastStrikeSemi) > 0.55){
        strike(cfg, 0.45 + Math.min(0.7, speed/900));
        lastStrike = now; lastStrikeSemi = semi;
      }
    }
  }

  function knock(hit){
    if (!AC || voice === 'off') return;
    const cfg = KIT[voice];
    if (cfg.kind === 'struck'){
      strike(cfg, 0.5 + Math.min(0.65, hit/900));
      lastStrike = performance.now(); lastStrikeSemi = semi;
      return;
    }
    const t = AC.currentTime;
    const o = AC.createOscillator(); o.type = 'triangle';
    o.frequency.value = currentFreq() * 2;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.min(0.16, hit/900*0.16) + 0.006, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.17);
  }

  // ---- tilt input -------------------------------------------------------
  const MAX_TILT = 30;
  let tiltX = 0, tiltY = 0, zeroX = 0, zeroY = 0;
  let haveSensor = false, pendingZero = true, denied = false;
  let touchMode = false, touchBound = false, touching = false;
  let targetX = 0, targetY = 0;

  function screenAngle(){
    if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
    return (typeof window.orientation === 'number') ? window.orientation : 0;
  }
  function onOrient(e){
    if (e.beta === null || e.gamma === null) return;
    if (!haveSensor){
      haveSensor = true; touchMode = false;
      hint.style.display = 'none';
      enableBtn.style.display = 'none';
    }
    let gx, gy;
    const a = ((screenAngle() % 360) + 360) % 360;
    if (a === 90)       { gx =  e.beta;  gy = -e.gamma; }
    else if (a === 180) { gx = -e.gamma; gy = -e.beta;  }
    else if (a === 270) { gx = -e.beta;  gy =  e.gamma; }
    else                { gx =  e.gamma; gy =  e.beta;  }
    if (pendingZero){ zeroX = gx; zeroY = gy; pendingZero = false; }
    tiltX = clamp(gx - zeroX, -50, 50);
    tiltY = clamp(gy - zeroY, -50, 50);
  }
  function setTarget(ev){
    targetX = clamp(((ev.clientX - W/2) / (W/2)) * MAX_TILT, -MAX_TILT, MAX_TILT);
    targetY = clamp(((ev.clientY - H/2) / (H/2)) * MAX_TILT, -MAX_TILT, MAX_TILT);
  }
  function bindTouch(){
    if (touchBound) return;
    touchBound = true;
    window.addEventListener('pointerdown', e => {
      if (e.target.tagName === 'BUTTON') return;
      touching = true; setTarget(e);
    });
    window.addEventListener('pointermove', e => { if (touching) setTarget(e); });
    const release = () => { touching = false; targetX = 0; targetY = 0; };
    window.addEventListener('pointerup', release);
    window.addEventListener('pointercancel', release);
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft')  { targetX = -22; touching = true; }
      if (e.key === 'ArrowRight') { targetX =  22; touching = true; }
      if (e.key === 'ArrowUp')    { targetY = -22; touching = true; }
      if (e.key === 'ArrowDown')  { targetY =  22; touching = true; }
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') targetX = 0;
      if (e.key === 'ArrowUp'   || e.key === 'ArrowDown')  targetY = 0;
    });
  }
  function enableTouchMode(){
    if (haveSensor) return;
    if (denied){
      hint.textContent = DECLINED;
      enableBtn.style.display = 'block';
    }
    touchMode = true; hint.style.display = 'block'; bindTouch();
  }

  // Safari only hands out motion data after an explicit yes, and only from
  // inside a user gesture, so this has to be callable again from a button.
  async function askMotion(){
    const DOE = window.DeviceOrientationEvent;
    if (!DOE) return false;
    if (typeof DOE.requestPermission !== 'function'){
      window.addEventListener('deviceorientation', onOrient, true);
      return true;
    }
    let res = 'denied';
    try { res = await DOE.requestPermission(); } catch(_) {}
    if (res === 'granted'){
      window.addEventListener('deviceorientation', onOrient, true);
      denied = false;
      return true;
    }
    denied = true;
    return false;
  }

  const NO_SENSOR = hint.textContent;
  const DECLINED  = 'Motion access was turned down, so tilt is off. Use the button above, or press and hold anywhere to tip the surface toward your finger.';
  const STUCK     = 'Safari is still refusing motion access. Reload the page to be asked again, or switch on Settings \u203A Safari \u203A Motion & Orientation Access.';

  enableBtn.addEventListener('click', async () => {
    enableBtn.disabled = true;
    const ok = await askMotion();
    setTimeout(() => {
      enableBtn.disabled = false;
      if (haveSensor) return;                 // onOrient hides the button itself
      hint.textContent = ok ? NO_SENSOR : STUCK;
      hint.style.display = 'block';
    }, ok ? 700 : 0);
  });

  async function start(){
    gate.classList.add('hidden');
    rack.style.display = 'block';
    recenterBtn.style.display = 'block';
    mixNotes();
    if (initAudio()) selectVoice(savedVoice());
    else {
      Array.prototype.forEach.call(document.querySelectorAll('.voice'), b => { b.disabled = true; });
    }

    const asked = await askMotion();
    setTimeout(() => { if (!haveSensor) enableTouchMode(); }, asked ? 600 : 0);
  }
  goBtn.addEventListener('click', start);
  recenterBtn.addEventListener('click', () => {
    pendingZero = true;
    tiltX = tiltY = targetX = targetY = 0;
    ball.vx = ball.vy = 0; ball.x = W/2; ball.y = H/2;
  });

  // ---- physics ----------------------------------------------------------
  const G = 1650, ROLL = 5/7, DEAD = 0.9, BOUNCE = 0.52, DRAG = 0.9;

  function step(dt){
    if (touchMode){
      const k = 1 - Math.exp(-9 * dt);
      tiltX += (targetX - tiltX) * k;
      tiltY += (targetY - tiltY) * k;
      if (!touching && Math.abs(tiltX) < 0.4) tiltX = 0;
      if (!touching && Math.abs(tiltY) < 0.4) tiltY = 0;
    }
    const ax = Math.abs(tiltX) < DEAD ? 0 : ROLL * G * Math.sin(tiltX * Math.PI/180);
    const ay = Math.abs(tiltY) < DEAD ? 0 : ROLL * G * Math.sin(tiltY * Math.PI/180);

    ball.vx += ax * dt; ball.vy += ay * dt;
    const damp = Math.exp(-DRAG * dt);
    ball.vx *= damp; ball.vy *= damp;
    if (ax === 0 && Math.abs(ball.vx) < 5) ball.vx = 0;
    if (ay === 0 && Math.abs(ball.vy) < 5) ball.vy = 0;

    const px = ball.x, py = ball.y;
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;

    let hit = 0;
    if (ball.x < R){   hit = Math.abs(ball.vx); ball.x = R;   ball.vx =  Math.abs(ball.vx) * BOUNCE; }
    if (ball.x > W-R){ hit = Math.abs(ball.vx); ball.x = W-R; ball.vx = -Math.abs(ball.vx) * BOUNCE; }
    if (ball.y < R){   hit = Math.max(hit, Math.abs(ball.vy)); ball.y = R;   ball.vy =  Math.abs(ball.vy) * BOUNCE; }
    if (ball.y > H-R){ hit = Math.max(hit, Math.abs(ball.vy)); ball.y = H-R; ball.vy = -Math.abs(ball.vy) * BOUNCE; }
    if (hit > 90) knock(hit);

    spin(ball.x - px, ball.y - py);
  }

  function spin(dx, dy){
    const d = Math.hypot(dx, dy);
    if (d < 0.0001) return;
    const ang = d / R;
    const ux = dy/d, uy = -dx/d, uz = 0;
    const c = Math.cos(ang), s = Math.sin(ang), t = 1-c;
    const A = [
      t*ux*ux + c,    t*ux*uy,        t*ux*uz + s*uy,
      t*ux*uy,        t*uy*uy + c,    t*uy*uz - s*ux,
      t*ux*uz - s*uy, t*uy*uz + s*ux, c
    ];
    const B = M, out = new Array(9);
    for (let r=0;r<3;r++) for (let col=0;col<3;col++){
      out[r*3+col] = A[r*3]*B[col] + A[r*3+1]*B[3+col] + A[r*3+2]*B[6+col];
    }
    M = out;
  }

  // ---- render -----------------------------------------------------------
  function draw(){
    ctx.clearRect(0,0,W,H);
    const lean = Math.min(1, Math.hypot(tiltX, tiltY)/40);
    const sx = ball.x + (tiltX/40) * R * 0.5;
    const sy = ball.y + (tiltY/40) * R * 0.5 + R*0.14;
    const col = mixedColor();
    const rgb = col[0]+','+col[1]+','+col[2];

    ctx.save();
    ctx.globalAlpha = 0.3 - lean*0.08;
    ctx.fillStyle = '#000';
    ctx.filter = 'blur(' + (R*0.28).toFixed(1) + 'px)';
    ctx.beginPath();
    ctx.ellipse(sx, sy, R*1.02, R*0.94, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    const halo = ctx.createRadialGradient(ball.x, ball.y, R*0.85, ball.x, ball.y, R*2.0);
    halo.addColorStop(0, 'rgba('+rgb+',0.5)');
    halo.addColorStop(1, 'rgba('+rgb+',0)');
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, R*2.0, 0, Math.PI*2);
    ctx.fillStyle = halo;
    ctx.fill();
    ctx.restore();

    const g = ctx.createRadialGradient(
      ball.x - R*0.35, ball.y - R*0.4, R*0.08,
      ball.x, ball.y, R*1.06
    );
    g.addColorStop(0,   '#5c5f6b');
    g.addColorStop(0.42,'#26272e');
    g.addColorStop(1,   '#0c0c10');
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, R, 0, Math.PI*2);
    ctx.fillStyle = g;
    ctx.fill();

    ctx.save();
    ctx.clip();
    for (const p of dots){
      const z = M[6]*p[0] + M[7]*p[1] + M[8]*p[2];
      if (z <= 0.05) continue;
      const x = M[0]*p[0] + M[1]*p[1] + M[2]*p[2];
      const y = M[3]*p[0] + M[4]*p[1] + M[5]*p[2];
      ctx.beginPath();
      ctx.arc(ball.x + x*R*0.9, ball.y + y*R*0.9, R*0.085*z + R*0.02, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,' + (0.16*z).toFixed(3) + ')';
      ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.75;
    const h = ctx.createRadialGradient(
      ball.x - R*0.34, ball.y - R*0.4, 0,
      ball.x - R*0.34, ball.y - R*0.4, R*0.62
    );
    h.addColorStop(0, 'rgba(255,255,255,.9)');
    h.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, R, 0, Math.PI*2);
    ctx.fillStyle = h;
    ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(ball.x, ball.y, R-0.6, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,.24)';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    const a = clamp((domW - 0.7) / 0.22, 0, 1);
    if (a > 0.01){
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = '600 ' + (R*0.95).toFixed(0) + 'px "Helvetica Neue",Helvetica,Arial,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.shadowColor = 'rgba(0,0,0,.45)';
      ctx.shadowBlur = 10;
      ctx.fillText(NOTES[domIdx].n, ball.x, ball.y - R*1.5);
      ctx.restore();
    }
  }

  let last = performance.now();
  function frame(now){
    let dt = Math.min((now - last)/1000, 1/30);
    last = now;
    for (let i=0;i<2;i++) step(dt/2);
    mixNotes();
    updateTone();
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  document.addEventListener('visibilitychange', () => {
    if (!AC) return;
    if (document.hidden) AC.suspend();
    else if (voice !== 'off') AC.resume();
  });

  document.addEventListener('touchmove', e => e.preventDefault(), {passive:false});
})();
</script></body></html>
